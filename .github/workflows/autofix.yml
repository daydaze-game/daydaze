# Formats every pull request and applies ESLint's safe fixes, then hands the
# diff to the autofix.ci GitHub App, which pushes it back to the PR as a
# commit. Agents then fail CI less often over formatting. Pull the PR branch
# before pushing again (AGENTS.md), since this may have added a commit.
# Real lint errors still fail ci.yml's lint job; this only fixes what can be
# fixed automatically. The name must stay exactly "autofix.ci": the app uses
# it to identify the workflow.
name: autofix.ci
on:
  pull_request:
    branches: [main]
concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npx prettier --write .
      # --fix exits nonzero when errors remain that it cannot fix; those are
      # ci.yml's to report, so this step only collects the fixable part
      - name: ESLint fixes
        run: npx eslint . --fix || true
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
