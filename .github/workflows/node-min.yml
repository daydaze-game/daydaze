name: Node minimum
# package.json says Node >=22.18, but ci.yml only runs the version in .nvmrc
# (24). This runs the unit tests on the minimum, so the "engines" claim stays
# true. Nothing here is a required check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "art/**"
concurrency:
  group: node-min-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    name: unit tests on Node 22.18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm test
