name: PR title
# The repo asks for Conventional Commit PR titles (AGENTS.md): feat(net): ...
# This fails a PR whose title does not follow the form. It is not a required
# check, so it never blocks an auto-merge; it just turns red.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # the title goes through an env var, never into the script text
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|refactor|test|chore|docs|perf|ci|build|revert|style)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error title=PR title::\"$TITLE\" is not a Conventional Commit title, for example: fix(net): stop dropping the first packet"
            exit 1
          fi
