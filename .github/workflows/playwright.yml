name: Tests
# The browser suites (Playwright on SwiftShader). ci.yml already runs lint,
# tests, typecheck and the build on the same triggers, so this file does not
# repeat them. The repo is public, so Actions minutes are free. A newer run on
# the same ref cancels the old one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  browser:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # the client suite is long on SwiftShader: four runners share it
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Headless WebGL runs on SwiftShader, so these are slow but real.
      - run: npm run test:e2e:client -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
  minigames:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-minigames
          path: test-results/
          retention-days: 14
