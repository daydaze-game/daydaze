name: Tests
# The browser suites (Playwright on SwiftShader). ci.yml already runs lint,
# tests, typecheck and the build on the same triggers, so this file does not
# repeat them. The repo is public, so Actions minutes are free. A newer run on
# the same ref cancels the old one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # the client suite is long on SwiftShader: four runners share it
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # A change that only touches docs or editor/lint config cannot break a
      # browser test: report green without the slow steps. The job still runs,
      # so the required check names (browser (1..4), minigames) always report.
      - id: scope
        name: Docs-only change?
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ -n "$PR" ] && [ "$(gh pr diff "$PR" --name-only | node --experimental-strip-types scripts/docs-only.ts)" = true ]; then
            run=false
            echo "Docs-only change: skipping the browser tests."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      # Headless WebGL runs on SwiftShader, so these are slow but real.
      - if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e:client -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
  minigames:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # A change that only touches docs or editor/lint config cannot break a
      # browser test: report green without the slow steps. The job still runs,
      # so the required check names (browser (1..4), minigames) always report.
      - id: scope
        name: Docs-only change?
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ -n "$PR" ] && [ "$(gh pr diff "$PR" --name-only | node --experimental-strip-types scripts/docs-only.ts)" = true ]; then
            run=false
            echo "Docs-only change: skipping the browser tests."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-minigames
          path: test-results/
          retention-days: 14
