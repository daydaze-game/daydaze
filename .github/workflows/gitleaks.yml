# Scan every push and pull request (and the full history weekly) for committed
# secrets: the repo works with many API keys, so a leak must fail the check
# before it merges. Config and the reviewed false positives: .gitleaks.toml.
name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI image, not gitleaks-action: the action needs a paid license
      # key once the repo belongs to an organization. Bump the tag by hand.
      - run: >
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner
