# GitHub's CodeQL security scanning for the TypeScript and JavaScript (the
# client, the Worker and the scripts) and for the workflow files themselves,
# on every push and pull request to main and once a week, so new queries catch
# old code. Findings land in the repo's Security tab, not as failed checks.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC: off the hour, when scheduled runs pile up
    - cron: "17 6 * * 1"
  workflow_dispatch:

# a newer push to the same branch or PR cancels the run in progress
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      # no build step: CodeQL reads JavaScript and TypeScript from source
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # the default suite plus the security-and-quality queries
          queries: security-and-quality
          config: |
            paths-ignore:
              - art
              - docs
              - public
              - prototypes
              - server/worker-configuration.d.ts
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
