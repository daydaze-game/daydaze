name: Link check
# Weekly check of every link in the README, CONTRIBUTING and docs/ (asset
# sources and credits rot). Broken links are listed in the run summary and kept
# in one open issue, updated each week and closed by hand once fixed.
# Settings: .lychee.toml. By hand: lychee --config .lychee.toml README.md CONTRIBUTING.md docs
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml README.md CONTRIBUTING.md docs
          format: markdown
          output: lychee-report.md
          jobSummary: true
          fail: false
      - name: Keep one issue with the broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "docs: broken links found by the link check"
        run: |
          id=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$id" ]; then
            gh issue edit "$id" --body-file lychee-report.md
          else
            gh issue create --title "$TITLE" --label documentation --body-file lychee-report.md
          fi
